<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://lh3.googleusercontent.com/EnJqoETOIJxrUUtq8Oaw1BkJR43i2JCX9TKSpYr2PKD9I8WK1BWCqo7dVSVFNkRMCSR_mMAhDtWyzuiS_9RhKqztTCk=w128-h128-e365-rj-sc0x00ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BestGem</title>
    
    <!-- Meta tags for SEO and social sharing -->
    <link rel="canonical" href="https://bestgem.glitch.me/">
    <meta name="description" content="Chat with your friends! Play games and earn coins to trade with your friends!">
    <meta property="og:title" content="BestGem">
    <meta property="og:type" content="chatroom">
    <meta property="og:url" content="https://bestgem.glitch.me/">
    <meta property="og:description" content="Chat with your friends! Play games and earn coins to trade with your friends!">
    <meta property="og:image" content="https://lh3.googleusercontent.com/EnJqoETOIJxrUUtq8Oaw1BkJR43i2JCX9TKSpYr2PKD9I8WK1BWCqo7dVSVFNkRMCSR_mMAhDtWyzuiS_9RhKqztTCk=w128-h128-e365-rj-sc0x00ffffff">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <form id="userinput">
      <input type="text" placeholder="Send a message..." id="message" autocomplete="off">
      <input type="submit" value="Send" id="send">
    </form>
    
    <div id="messages">
      
    </div>
    <div id="members">
      <b><h3>
        People online:
        </h3></b>
    </div>
    <script src="/chat.js" defer></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const form = document.getElementById("userinput")
      const message = document.getElementById('message')
      const socket = io();
      
      if (("Notification" in window)){
        Notification.requestPermission()
      }
      
      function sendNotification(text) {
        if (!("Notification" in window)) {
          console.log("Browser does not support notifications.");
          return;
        }

        Notification.requestPermission().then((permission) => {
          if (permission === "granted") {
            const notification = new Notification("Hello!", {
              body: text, icon:"https://lh3.googleusercontent.com/EnJqoETOIJxrUUtq8Oaw1BkJR43i2JCX9TKSpYr2PKD9I8WK1BWCqo7dVSVFNkRMCSR_mMAhDtWyzuiS_9RhKqztTCk=w128-h128-e365-rj-sc0x00ffffff",
            });

            notification.addEventListener("click", () => {
              console.log("Notification clicked");
            });

            notification.addEventListener("error", (error) => {
              console.error("Error displaying notification:", error);
            });
          }
        });
      }
      
      var ctrl = false;
      document.addEventListener("keydown", (e) => {
        if (e.key == "Control") ctrl = true;
      });

      document.addEventListener("keyup", (e) => {
        if (e.key == "Control") ctrl = false;
      });

      document.addEventListener("keydown", (e) => {
        // message.value = message.value + e.key
        if (!ctrl)
          message.focus();
      });

      
      const queryString = window.location.search
      const urlParams = new URLSearchParams(queryString)
      var room = urlParams.get('room')
      var token = urlParams.get('token')
      
      socket.emit('message', {token, message: 'has joined '+room, room});
      socket.emit('requestroomlist',{ room, token })
      
      var previousId = -1
      form.addEventListener('submit', (e) => {
        e.preventDefault()
        if (message.value) {
          socket.emit('message', {token, message: message.value, room});
          message.value = '';
        }
      })
      function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }
      var messageBodyExt = document.getElementById('messages')
      message.onfocus = () => {
        if(!isMobile()) return
        messageBodyExt.style.top = "45vh"
        messageBodyExt.style.maxHeight = "45vh"
      }
      message.onblur = () => {
        if(!isMobile()) return
        messageBodyExt.style.top = "0"
        messageBodyExt.style.maxHeight = "90vh"
      }
      
      let typingtimer;
      var typing = false
      var doneTypingInterval = 1000
      message.addEventListener('input', e => {
        socket.emit('typing',{ room, token })
        if(typing == false) new Message({username: "Server", message: "you are typing!", timestamp: Date.now(), userId: "Server"})
        typing  = true
        clearTimeout(typingtimer)
        typingtimer = setTimeout(() => {
          socket.emit('doneTyping',{ room, token })
          new Message({username: "Server", message: "you stopped typing!", timestamp: Date.now(), userId: "Server"})
          typing = false
        }, doneTypingInterval)
      })
      class Message{
        constructor(data){
          var date = new Date(data.timestamp)
          var minutes = `${date.getMinutes()}`
          var hours = `${date.getHours()}`
          if(hours < 10) hours = '0'+hours
          if(minutes < 10) minutes = '0'+minutes
          date = `${hours}:${minutes}`
          
          
          const messageBox = document.createElement('div')
          const usernameBody = document.createElement('b')
          const messageBody = document.createElement('p')
          const dateBody = document.createElement('span')
          const replyBtn = document.createElement('button')
          
          replyBtn.classList.add('replyBtn')
          messageBody.classList.add('messageBody')
          messageBox.classList.add('messageBox')
          usernameBody.classList.add('usernameBody')
          dateBody.classList.add('dateBody')
          
          replyBtn.innerText = 'Reply'
          dateBody.innerText = date
          if(data.command) dateBody.innerText += " - "+data.command.executor+" used /"+data.command.name
          if(data.repliedto) {
            const tooltip = document.createElement('div')
            const replyUserBody = document.createElement('b')
            const replymsgBody = document.createElement('p')
            replymsgBody.innerText = data.repliedtomsg
            replyUserBody.innerText = data.repliedto
            tooltip.classList.add('tooltip')
            tooltip.classList.add('messageBox')
            replymsgBody.classList.add('messageBody')
            replyUserBody.classList.add('usernameBody')
            tooltip.appendChild(replyUserBody)
            tooltip.appendChild(replymsgBody)
            dateBody.innerText += " - "+data.username+" replied to "+data.repliedto
            dateBody.classList.add('reply')
            dateBody.appendChild(tooltip)
          }
          messageBody.innerHTML = data.message
          if(previousId == data.userId){
            messageBox.classList.add('sameUser')
            messageBody.appendChild(dateBody)
          }else{
            usernameBody.innerText = data.username
            messageBox.appendChild(usernameBody)
            usernameBody.appendChild(dateBody)
          }
          
          messageBox.appendChild(messageBody)
          messageBox.appendChild(replyBtn)
          document.getElementById('messages').appendChild(messageBox)
          document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight
          messageBox.classList.add('shake')
          previousId = data.userId
          
          replyBtn.onclick = (e) => {
            if(message.value == '') return
            socket.emit('reply',{token, message: message.value, room, replyId: data.id})
            message.value = ''
          }
        }
      }
      new Message({username: "Server", message: "Welcome! Remember to follow the rules and respect the community!", timestamp: Date.now(), userId: "Server"})
      socket.on('join', (user) => {
        user = user.user
        new Message({username: "Server", message: user.username+" has joined the room", timestamp: Date.now(), userId: "Server"})
        socket.emit('requestroomlist',{ room, token })
      })
      
      socket.on('message', (userdata) => {
        if(!userdata.status.success) return new Message({username: userdata.username, message: userdata.status.message, timestamp: Date.now(), userId: userdata.userId})
        new Message(userdata)
      })
      socket.on('reply', (userdata) => {
        var newMessage = {username: userdata.username, message: userdata.status.message, timestamp: Date.now(), userId: userdata.userId}
        if(userdata.repliedto) newMessage.repliedto = userdata.repliedto
        if(!userdata.status.success) return new Message()
        new Message(userdata)
      })
      socket.on('usersInRoom', (users) => {
        document.getElementById('members').innerHTML = '<h3>People online:</h3>'
        console.log(users)
        users.forEach(user => {
          const userbox = document.createElement('b')
          const id = document.createElement('span')
          const br = document.createElement('br')
          userbox.innerText = user.user.username
          id.innerText = " #"+user.user.id
          id.classList.add('dateBody')
          document.getElementById('members').appendChild(br)
          document.getElementById('members').appendChild(userbox)
          document.getElementById('members').appendChild(id)
        })
      })
      socket.on('userLeft', (user) => {
        new Message({username: "Server", message: user.username+" has left the room", timestamp: Date.now(), userId: "Server"})
        socket.emit('requestroomlist',{ room, token })
      })
      
    </script>
  </body>
</html>
