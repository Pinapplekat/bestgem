    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <form id="userinput">
      <input type="text" placeholder="Send a message..." id="message" autocomplete="off">
      <input type="submit" value="Send">
    </form>
    
    <div id="messages">
      
    </div>
    <script src="/chat.js" defer></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
      const form = document.getElementById("userinput")
      const message = document.getElementById('message')
      const socket = io();
      var previousId = -1

      form.addEventListener('submit', (e) => {
        e.preventDefault()
        if (message.value) {
          const queryString = window.location.search
          const urlParams = new URLSearchParams(queryString)
          var room = urlParams.get('room')
          var token = urlParams.get('token')
          socket.emit('message', {token, message: message.value, room});
          message.value = '';
        }
      })
      class Message{
        constructor(data){
          var date = new Date(data.timestamp)
          
          const messageBox = document.createElement('div')
          const usernameBody = document.createElement('b')
          const messageBody = document.createElement('p')
          
          messageBody.classList.add('messageBody')
          messageBox.classList.add('messageBox')
          usernameBody.classList.add('usernameBody')
          
          messageBody.innerText = data.message
          console.log("USER ID: "+data.userId)
          if(previousId == data.userId){
            messageBox.classList.add('sameUser')
          }else{
            usernameBody.innerText = data.username
            messageBox.appendChild(usernameBody)
          }
          
          messageBox.appendChild(messageBody)
          document.getElementById('messages').appendChild(messageBox)
          
          previousId = data.userId
        }
      }
      
      socket.on('join', (user) => {
        user = user.user
        new Message({username: "Server", message: user.username+" has joined the room", timestamp: Date.now(), userId: user.id})
      })
      
      socket.on('message', (data) => {
        if(!data.status.success) return new Message({username: data.username, message: data.status.message, timestamp: Date.now(), userId: data.userId})
        new Message(data)
      })
    </script>
  </body>
</html>
